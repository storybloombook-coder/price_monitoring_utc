[project]
name = "price-monitor-v5"
version = "5.0.2"
description = "Local-first Windows marketplace price monitoring application"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "playwright==1.62.0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
  "websockets==17.1",
]

[project.optional-dependencies]
build = ["pyinstaller==6.15.0"]
test = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
